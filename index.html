<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="A preview of an article about the foundations of HTML and CSS."
    />
    <link rel="icon" type="image/png" sizes="32x32" href="./assets/images/favicon-32x32.png" />
    <link rel="stylesheet" href="./style.css" />
    <title>Blog preview card</title>
  </head>
  <body>
    <main class="page">
      <article class="card" id="article" aria-labelledby="article-title">
        <img
          class="card__illustration"
          src="./assets/images/illustration-article.svg"
          alt="Abstract yellow, black, and white illustration"
        />

        <div class="card__content">
          <p class="card__category">Learning</p>
          <p class="card__date">Published 21 Dec 2023</p>
          <h1 class="card__title" id="article-title">
            <a class="card__link" href="#article">HTML &amp; CSS foundations</a>
          </h1>
          <p class="card__description">
            These languages are the backbone of every website, defining structure,
            content, and presentation.
          </p>

          <div class="author">
            <img
              class="author__avatar"
              src="./assets/images/image-avatar.webp"
              alt=""
            />
            <p class="author__name">Greg Hooper</p>
          </div>
        </div>
      </article>
    </main>
  </body>
</html>
